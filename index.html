<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;padding:34px 38px}
.header{font-size:30px;font-weight:400;letter-spacing:-.5px;margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 min-height:138px;border-radius:12px;background:#171717;color:#f5f5f5;
 text-decoration:none;border:1px solid #202020;
 transition:background .12s,transform .12s
}
.tile:active{background:#252525;transform:scale(.985)}
.primary{grid-column:1/-1;min-height:154px;background:#1c1c1c}
.label{margin-top:14px;font-size:20px;font-weight:400;letter-spacing:-.2px}
.primary .label{font-size:24px}
.icon{width:38px;height:38px;stroke:#e5e5e5;stroke-width:1.55;fill:none;stroke-linecap:round;stroke-linejoin:round}
.primary .icon{width:42px;height:42px}
@media(max-width:900px){
 .page{padding:28px 24px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .label{font-size:18px}
 .primary .label{font-size:22px}
}
</style>
</head>
<body>
<div class="page">
<div class="header">Raccourcis</div>
<div class="grid">

<a class="tile primary" href="https://ugpp4gs1gu1hbk1oyexehymq140hv73c.ui.nabu.casa">
<svg class="icon" viewBox="0 0 24 24"><path d="M3.5 10.8 12 3.8l8.5 7"/><path d="M5.5 9.8V20h13V9.8"/><path d="M9.5 20v-5h5v5"/></svg>
<span class="label">Home Assistant</span>
</a>

<a class="tile" href="https://www.chargemap.com/">
<svg class="icon" viewBox="0 0 24 24"><path d="m13 2-8 11h6l-1 9 8-11h-6l1-9Z"/></svg>
<span class="label">Chargemap</span>
</a>

<a class="tile" href="https://www.waze.com/">
<svg class="icon" viewBox="0 0 24 24"><path d="M5 15c-2 0-3-1.5-2-4 1-5 4.8-8 9-8 4.8 0 7.8 3 9 8 .5 2-1 4-3 4H7"/><path d="M7 18h10"/><circle cx="8" cy="12.5" r=".9"/><circle cx="16" cy="12.5" r=".9"/></svg>
<span class="label">Waze</span>
</a>

<a class="tile" href="https://www.google.com/search?q=m%C3%A9t%C3%A9o+Bruay-la-Buissi%C3%A8re">
<svg class="icon" viewBox="0 0 24 24"><path d="M6 17h11a4 4 0 0 0 0-8 6 6 0 0 0-11 2 3 3 0 0 0 0 6Z"/></svg>
<span class="label">Météo</span>
</a>

<a class="tile" href="https://www.tesla.com/">
<svg class="icon" viewBox="0 0 24 24"><path d="M4 7.5c1.8-2.3 4.5-3.5 8-3.5s6.2 1.2 8 3.5"/><path d="M7 7.5c1 2.7 2.7 5.5 5 9.5 2.3-4 4-6.8 5-9.5"/><path d="M4 7.5h16"/></svg>
<span class="label">Tesla</span>
</a>

<a class="tile" href="https://open.spotify.com/">
<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7 9c3.2-1 6.8-.8 10 .7"/><path d="M7.5 12c2.5-.7 5.5-.4 8 .8"/><path d="M8 15c1.9-.4 4-.2 6 .6"/></svg>
<span class="label">Spotify</span>
</a>

</div>
</div>
</body>
</html>
